---
layout: default
title: Forest Drift
description: Deep cinematic forest ambience experience.
---

<section class="scene-page forest-drift-scene">

  <div class="scene-background forest-bg"></div>

  <div class="forest-depth depth-back"></div>
  <div class="forest-depth depth-mid"></div>
  <div class="forest-depth depth-front"></div>

  <div class="forest-vignette"></div>

  <div class="scene-ui">

    <button
      class="scene-btn"
      id="birdsToggleBtn"
    >
      🌿 Birds
    </button>

    <button
      class="scene-btn"
      id="windToggleBtn"
    >
      🌬 Wind
    </button>

    <a
      class="scene-btn"
      href="{{ "/aesthetic-scenes/" | relative_url }}"
    >
      ← Back
    </a>

  </div>

</section>

<style>

.forest-drift-scene {
  position: relative;
  width: 100%;
  height: 100vh;
  overflow: hidden;
}

.forest-bg {

  position: fixed;
  inset: 0;

  background:
    url('{{ "/assets/images/Harmoniza-body-background-image.jpg" | relative_url }}')
    center center / cover no-repeat;

  filter:
    brightness(0.45)
    saturate(1.15)
    contrast(1.05);

  transform: scale(1.05);

  z-index: 1;
}

.forest-depth {
  position: fixed;
  inset: 0;
  pointer-events: none;
}

.depth-back {

  background:
    radial-gradient(
      circle at center,
      rgba(30, 60, 40, 0.15),
      rgba(0, 0, 0, 0.5)
    );

  z-index: 2;
}

.depth-mid {

  -webkit-backdrop-filter: blur(3px);
  backdrop-filter: blur(3px);

  opacity: 0.3;

  z-index: 3;
}

.depth-front {

  background:
    linear-gradient(
      to bottom,
      rgba(255,255,255,0.03),
      rgba(0,0,0,0.35)
    );

  mix-blend-mode: screen;

  z-index: 4;
}

.forest-vignette {

  position: fixed;
  inset: 0;

  background:
    radial-gradient(
      circle at center,
      transparent 30%,
      rgba(0,0,0,0.6) 100%
    );

  z-index: 5;

  pointer-events: none;
}

.scene-ui {

  position: fixed;

  bottom: 30px;
  left: 30px;

  display: flex;
  gap: 12px;
  flex-wrap: wrap;

  z-index: 20;
}

.scene-btn {

  padding: 12px 16px;

  border: none;
  border-radius: 14px;

  background:
    rgba(20,20,20,0.45);

  color: white;

  text-decoration: none;

  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);

  cursor: pointer;

  transition:
    transform 0.25s ease,
    background 0.25s ease;
}

.scene-btn:hover {

  transform: translateY(-2px);

  background:
    rgba(255,255,255,0.12);
}

</style>

<script>

window.addEventListener("DOMContentLoaded", () => {

  if (window.SceneLoader) {
    SceneLoader.init("forest-drift");
  }

  const birdsBtn =
    document.getElementById(
      "birdsToggleBtn"
    );

  const windBtn =
    document.getElementById(
      "windToggleBtn"
    );

  if (birdsBtn) {

    birdsBtn.addEventListener(
      "click",
      () => {

        SceneEngine.toggleAudio(
          "birds",
          birdsBtn
        );

      }
    );

  }

  if (windBtn) {

    windBtn.addEventListener(
      "click",
      () => {

        SceneEngine.toggleAudio(
          "wind",
          windBtn
        );

      }
    );

  }

  const back =
    document.querySelector(".depth-back");

  const mid =
    document.querySelector(".depth-mid");

  const front =
    document.querySelector(".depth-front");

  function updateDepth() {

    if (!window.SceneEngine?.windField) {

      requestAnimationFrame(updateDepth);
      return;

    }

    const wind =
      SceneEngine
        .windField
        .getVector();

    if (back) {

      back.style.transform =
        `translate(
          ${wind.x * 10}px,
          ${wind.y * 5}px
        )`;

    }

    if (mid) {

      mid.style.transform =
        `translate(
          ${wind.x * 18}px,
          ${wind.y * 8}px
        )`;

    }

    if (front) {

      front.style.transform =
        `translate(
          ${wind.x * 25}px,
          ${wind.y * 12}px
        )`;

    }

    requestAnimationFrame(updateDepth);

  }

  updateDepth();

});

</script>

<script
  src="{{ "/assets/js/scenes/forest-drift.js" | relative_url }}"
  defer
></script>
